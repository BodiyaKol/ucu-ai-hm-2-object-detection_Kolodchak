# experiment: retinanet/base — M4: one-stage anchor-based, k-means-grounded anchors (default 32..512 misses 69% of boxes)
model:
  name: retinanet
  anchor_sizes: [8, 16, 32, 64, 128]   # x3 scales (2^(0/3), 2^(1/3), 2^(2/3)) x3 ratios = 9 anchors / location
  topk_candidates: 1000                 # per FPN level before NMS
train:
  imgsz: 1024
  batch: 4
  workers: 4
  lr: 0.0025         # focal loss is sensitive to high LR; reference 0.01 @ batch 16
  epochs: 12
  max_minutes: 25
mini:
  imgsz: 320
  batch: 2
  workers: 0
  epochs: 1
  max_minutes: 1
